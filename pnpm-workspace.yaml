allowBuilds:
  esbuild: true
  workerd: false
patchedDependencies:
  # Adds deleteUser, which convex/account.ts needs, and lets a loopback origin in
  # allowedRedirectOrigins allow every port, which convex/auth.ts needs for the dev server. Remove
  # each when Convex Auth ships it.
  "@convex-dev/auth@2.0.0-beta.0": patches/@convex-dev__auth@2.0.0-beta.0.patch
overrides:
  # Version floors from samebase/base's supply-chain checks.
  "@hono/node-server": 2.1.5
  "@modelcontextprotocol/sdk": 1.32.2
  "brace-expansion@5": 5.0.12
  browserslist: 4.29.5
  fast-uri: 4.2.3
  hono: 4.13.14
  ip-address: 10.7.5
  js-yaml: 5.5.0
  nanoid: 6.0.2
  postcss: "^8.5.23"
  postcss-selector-parser: 7.1.7
  proxy-addr: 2.0.8
  qs: 6.17.1
  seroval: 1.7.6
  source-map-js: 1.2.2
  tinypool: 2.2.0
  "undici@7": 8.12.3
  "undici@8": 8.12.3
  vite: "catalog:"
  vitest: "catalog:"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  # Our own releases, which this repository may install as soon as they are published.
  - "@samebase/*"
